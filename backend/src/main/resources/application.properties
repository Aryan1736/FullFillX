spring.application.name=fulfillx

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fulfillx}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:fulfillx}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:fulfillx}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Docker Compose (disabled in container deployments)
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}

# Spring AI (optional; placeholder allows startup without a real key)
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Validation messages
spring.messages.basename=ValidationMessages

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.override-with-generic-response=false
springdoc.writer-with-order-by-keys=true

# Logging
logging.level.com.aryan.fulfillx=INFO
logging.level.org.springframework.web=WARN
