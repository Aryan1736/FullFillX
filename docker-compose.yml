services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillx}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfillx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fulfillx} -d ${POSTGRES_DB:-fulfillx}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fulfillx-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fulfillx}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fulfillx}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fulfillx}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: fulfillx-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
